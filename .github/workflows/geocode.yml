name: Geocode restaurants

on:
  push:
    branches:
      - main
    paths:
      - "_data/restaurants.json"

jobs:
  geocode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        run: pip install uv

      - name: Geocode missing coordinates
        run: uv run python scripts/geocode.py

      - name: Commit resolved coordinates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet _data/restaurants.json; then
            git add _data/restaurants.json
            git commit -m "chore: geocode restaurant coordinates [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
